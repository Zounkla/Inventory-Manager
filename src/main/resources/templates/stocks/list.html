<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Inventory Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Stock Inventory Manager</h1>
        </header>
        
        <div class="actions">
            <a href="/stocks/new" class="btn btn-primary">Add New Stock</a>
        </div>

        <div th:if="${success}" class="alert alert-success">
            <span th:text="${success}"></span>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <span th:text="${error}"></span>
        </div>

        <table class="stock-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${stocks.empty}">
                    <td colspan="6" class="no-data">No stocks available. Click "Add New Stock" to create one.</td>
                </tr>
                <tr th:each="stock : ${stocks}">
                    <td th:text="${stock.id}"></td>
                    <td th:text="${stock.name}"></td>
                    <td th:text="${stock.quantity}"></td>
                    <td th:text="${'$' + #numbers.formatDecimal(stock.price, 1, 2)}"></td>
                    <td th:text="${stock.description}"></td>
                    <td class="actions-cell">
                        <a th:href="@{/stocks/edit/{id}(id=${stock.id})}" class="btn btn-edit">Edit</a>
                        <a th:href="@{/stocks/delete/{id}(id=${stock.id})}" 
                           class="btn btn-delete" 
                           onclick="return confirm('Are you sure you want to delete this stock?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
